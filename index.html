<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Terror Cinematográfico</title>
    <link href="https://susievelyn.github.io/Arquivo-sinistro/" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow-x: hidden; background: #000; color: #fff; }
        
        /* PLANO DE FUNDO INTERATIVO COM EFEITO DE RAIOS */
        .screen { 
            min-height: 100vh; 
            background-image: 
                linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(139,0,0,0.3) 50%, rgba(0,0,0,0.8) 100%),
                url('https://images.unsplash.com/photo-1509023464722-18d996393ca8?w=1920');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            position: relative; 
            overflow-y: auto; 
        }
        
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(2px); }
        .flicker { position: fixed; inset: 0; background: #000; pointer-events: none; z-index: 9999; animation: flicker 4s infinite; }
        @keyframes flicker { 0%, 100% { opacity: 0; } 50% { opacity: 0.1; } }
        
        /* EFEITO DE RAIOS E TROVÕES */
        @keyframes lightning {
            0%, 100% { opacity: 0; }
            45%, 55% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .screen::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            animation: lightning 15s infinite;
            z-index: 1;
        }
        
        .container { position: relative; z-index: 10; text-align: center; max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        
        .skull-icon { width: 80px; height: 80px; margin: 0 auto 30px; filter: drop-shadow(0 0 20px rgba(220,38,38,0.5)); }
        
        .title { font-family: 'Creepster', cursive; font-size: clamp(2.5rem, 8vw, 5rem); color: #dc2626; text-shadow: 4px 4px 8px rgba(0,0,0,0.9), 0 0 20px rgba(220, 38, 38, 0.5); margin-bottom: 20px; letter-spacing: 0.2em; }
        .subtitle { font-size: 1.2rem; color: #ccc; margin-bottom: 40px; }
        
        .form-box { background: rgba(39, 39, 42, 0.9); border: 2px solid #dc2626; border-radius: 15px; padding: 30px; max-width: 500px; margin: 0 auto 40px; backdrop-filter: blur(10px); }
        .form-box h3 { font-family: 'Creepster', cursive; color: #dc2626; font-size: 1.8rem; margin-bottom: 20px; }
        
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .input { flex: 1; min-width: 200px; padding: 15px; background: rgba(10, 10, 10, 0.9); border: 2px solid #666; border-radius: 8px; color: #fff; font-size: 1rem; }
        .input:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 15px rgba(220, 38, 38, 0.5); }
        
        .btn { padding: 15px 30px; font-family: 'Creepster', cursive; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #8B0000, #dc2626); color: #fff; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(220, 38, 38, 0.8); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(63, 63, 70, 0.8); color: #fff; border: 1px solid #666; padding: 10px 20px; font-size: 0.9rem; }
        .btn-secondary:hover { background: rgba(82, 82, 91, 0.9); }
        
        .player-info { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .player-name { color: #22c55e; font-size: 1.2rem; }
        
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto 40px; }
        .movie-card { position: relative; aspect-ratio: 2/3; border: 4px solid #dc2626; border-radius: 10px; overflow: hidden; cursor: pointer; transition: all 0.3s; background-size: cover; background-position: center; }
        .movie-card:hover { transform: scale(1.05) translateY(-5px); box-shadow: 0 0 30px rgba(220, 38, 38, 0.8); }
        .movie-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.5), transparent); }
        .movie-title { position: absolute; top: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); padding: 10px; text-align: center; font-family: 'Creepster', cursive; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .ranking-box { background: rgba(39, 39, 42, 0.9); border: 2px solid #dc2626; border-radius: 15px; padding: 30px; max-width: 800px; margin: 0 auto; backdrop-filter: blur(10px); }
        .ranking-title { font-family: 'Creepster', cursive; color: #dc2626; font-size: 2rem; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .ranking-list { max-height: 400px; overflow-y: auto; }
        .ranking-item { background: rgba(10, 10, 10, 0.8); border: 1px solid #444; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
        .ranking-position { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Creepster', cursive; font-size: 1.2rem; flex-shrink: 0; }
        .gold { background: #fbbf24; color: #000; }
        .silver { background: #d1d5db; color: #000; }
        .bronze { background: #fb923c; color: #fff; }
        .normal { background: #dc2626; color: #fff; }
        .ranking-info { flex: 1; min-width: 0; }
        .ranking-name { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ranking-movie { font-size: 0.85rem; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ranking-score { font-family: 'Creepster', cursive; font-size: 1.5rem; color: #22c55e; flex-shrink: 0; }
        
        .quiz-screen { max-width: 1400px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
        @media (max-width: 768px) { .quiz-screen { grid-template-columns: 1fr; } }
        
        .quiz-poster { aspect-ratio: 2/3; background-size: cover; background-position: center; border-radius: 15px; box-shadow: 0 20px 60px rgba(220, 38, 38, 0.4); }
        .quiz-content { display: flex; flex-direction: column; gap: 20px; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .quiz-progress { color: #dc2626; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; }
        .difficulty-badge { padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; border: 1px solid; }
        .diff-facil { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #86efac; }
        .diff-medio { background: rgba(251, 191, 36, 0.2); border-color: #fbbf24; color: #fde047; }
        .diff-dificil { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5; }
        .quiz-question { font-family: 'Creepster', cursive; font-size: clamp(1.5rem, 4vw, 2.5rem); color: #fff; line-height: 1.3; }
        .quiz-divider { height: 3px; width: 60px; background: #dc2626; }
        
        .options { display: flex; flex-direction: column; gap: 15px; }
        .option { background: rgba(39, 39, 42, 0.8); border: 2px solid #444; border-radius: 10px; padding: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s; text-align: left; color: #fff; }
        .option:hover:not(:disabled) { background: rgba(63, 63, 70, 0.9); border-color: #666; transform: translateX(5px); }
        .option:disabled { cursor: not-allowed; }
        .option.correct { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #86efac; }
        .option.incorrect { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5; }
        .option-letter { width: 35px; height: 35px; background: rgba(10, 10, 10, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; }
        .option.correct .option-letter { background: #22c55e; color: #000; }
        .option.incorrect .option-letter { background: #ef4444; color: #fff; }
        
        .feedback { background: rgba(39, 39, 42, 0.9); border: 1px solid #444; border-radius: 10px; padding: 15px; font-size: 0.9rem; }
        .feedback.correct { color: #86efac; }
        .feedback.incorrect { color: #fca5a5; }
        
        .score-display { position: fixed; top: 20px; right: 20px; background: rgba(39, 39, 42, 0.9); border: 2px solid #dc2626; border-radius: 10px; padding: 20px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3); z-index: 100; }
        .score-label { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .score-value { font-family: 'Creepster', cursive; font-size: 2rem; color: #fff; }
        
        .results-icon { width: 100px; height: 100px; margin: 0 auto 30px; }
        .results-title { font-family: 'Creepster', cursive; font-size: clamp(2.5rem, 8vw, 4rem); margin-bottom: 20px; }
        .success { color: #22c55e; text-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
        .warning { color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
        .danger { color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
        .results-msg { font-size: 1.2rem; color: #ccc; margin-bottom: 40px; }
        .results-box { background: rgba(39, 39, 42, 0.8); border: 2px solid #dc2626; border-radius: 15px; padding: 40px; margin-bottom: 40px; backdrop-filter: blur(10px); }
        .results-score { font-family: 'Creepster', cursive; font-size: 4rem; margin-bottom: 10px; }
        .results-label { font-size: 1.2rem; color: #999; margin-bottom: 30px; }
        .stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .star { width: 30px; height: 30px; }
        .results-percent { font-family: 'Creepster', cursive; font-size: 2.5rem; color: #999; }
        
        .jumpscare { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; animation: shake 0.3s infinite; }
        .jumpscare img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes shake { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(-10px, 10px) rotate(-5deg); } 75% { transform: translate(10px, -10px) rotate(5deg); }  }
        
        .hidden { display: none !important; }

        /* BOTÕES DE CONTROLE */
        .control-buttons { position: fixed; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 200; }
        .control-btn { width: 50px; height: 50px; background: rgba(39, 39, 42, 0.9); border: 2px solid #dc2626; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; backdrop-filter: blur(10px); box-shadow: 0 5px 15px rgba(220, 38, 38, 0.3); }
        .control-btn:hover { background: rgba(220, 38, 38, 0.3); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(220, 38, 38, 0.5); }
        .control-btn svg { width: 24px; height: 24px; stroke: #dc2626; stroke-width: 2; fill: none; }
    </style>
</head>
<body>
    <!-- BOTÕES DE CONTROLE -->
    <div class="control-buttons">
        <button class="control-btn" onclick="toggleFullscreen()" title="Tela Cheia">
            <svg viewBox="0 0 24 24">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
        </button>
        <button class="control-btn" onclick="resetGame()" title="Resetar Jogo">
            <svg viewBox="0 0 24 24">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
        </button>
    </div>

    <div id="app"></div>
    <div id="jumpscare" class="jumpscare hidden">
        <img src="j.jpg" alt="Jumpscare">
    </div>

    <script>
        const movieNames = {
            nightmare: 'A Hora do Pesadelo',
            smile: 'Sorria',
            insidious: 'Sobrenatural',
            conjuring: 'Invocação do Mal',
            speak: 'Fale comigo',
            friday13: 'Sexta-Feira 13',
            supernatural: 'Supernatural',
            street: 'Rua do medo',
            panic: 'Pânico',
            saw: 'Jogos Mortais',
            it: 'It - A Coisa',
            carrie: 'Carrie - A Estranha'
        };

        const questionsByMovie = {
            nightmare: [
                { poster: 'Freddy 1.jpg', difficulty: 'facil', question: 'Um, dois… não vou parar, Três, quatro… vou te encontrar. Canção leve, mas cheia de dor, Anuncia a chegada do terror. Quem sou eu?', options: ['Rádio quebrado', 'Canção infantil', 'Música / cantiga do Freddy', 'Sussurro da escola'], correctAnswer: 2 },
                { poster: 'Freddy 1.jpg', difficulty: 'facil', question: 'Não estou acordado, mas também não estou morto, É nesse lugar que encontro meu confronto. Se você entrar, pode não sair, Pois é aqui que começo a agir.', options: ['Sonho', 'Labirinto', 'Escuridão', 'Memória perdida'], correctAnswer: 0 },
                { poster: 'Freddy 1.jpg', difficulty: 'facil', question: 'Não sou lâmina comum, mas posso cortar. Em dedos afiados começo a atuar. Sou extensão de quem quer te ferir, E não há como de mim fugir.', options: ['Machado enferrujado', 'Garras demoníacas', 'Luva com lâminas', 'Foice de aço'], correctAnswer: 1 },
                { poster: 'Freddy 1.jpg', difficulty: 'medio', question: 'Sou o medo que cresce ao descansar. Quanto mais você tenta evitar, mais vou te alcançar. Sem precisar de porta pra entrar, Eu apareço quando você vai deitar.', options: ['Ilusão', 'Alucinação', 'Paralisia do sono', 'Pesadelo'], correctAnswer: 3 },
                { poster: 'Freddy 1.jpg', difficulty: 'medio', question: 'Sou o passado que voltou pra cobrar, Mesmo destruído, continuo a caçar. Não pertenço mais ao mundo real, Mas faço dele algo fatal.', options: ['Afogado', 'Queimado vivo', 'Enforcado', 'Baleado'], correctAnswer: 1 },
                { poster: 'Freddy 1.jpg', difficulty: 'medio', question: 'Sou o limite entre viver e morrer, Se ultrapassar, você pode desaparecer. Não sou porta, mas sou passagem, E nela acontece a pior viagem.', options: ['Inferno sombrio', 'Labirinto mental', 'Mundo dos sonhos', 'Reino oculto'], correctAnswer: 2 },
                { poster: 'Freddy 1.jpg', difficulty: 'dificil', question: 'Sou o que te salva por um tempo, Mas cobra caro pelo sofrimento. Você me busca pra não dormir, Mas no final vai cair.', options: ['Cafeína', 'Desespero', 'Energia artificial', 'Insônia'], correctAnswer: 3 },
                { poster: 'Freddy 1.jpg', difficulty: 'dificil', question: 'Sou o lugar comum que virou maldição, Onde começou toda a destruição. Não pareço perigoso ao olhar, Mas carrego um terror sem igual.', options: ['Rua Elm', 'Crystal Lake', 'Silent Hill', 'Haddonfield'], correctAnswer: 0 },
                { poster: 'Freddy 1.jpg', difficulty: 'dificil', question: 'Sou o momento em que você acha que acordou, Mas ainda está preso onde tudo começou. Engano sua mente com perfeição, E te prendo mais fundo na ilusão.', options: ['Alucinação coletiva', 'Pesadelo repetido', 'Viagem astral', 'Falso despertar'], correctAnswer: 3 }
            ],
            smile: [
                { poster: 'Sorria 2.jpg', difficulty: 'facil', question: 'Meu rosto parece feliz e normal, Mas escondo algo sobrenatural. O que anuncia minha presença?', options: ['Olhos negros', 'Sorriso perturbador', 'Voz estranha', 'Sombras'], correctAnswer: 1 },
                { poster: 'Sorria 2.jpg', difficulty: 'facil', question: 'Para continuar existindo preciso passar, De vítima em vítima sem parar. Como a entidade se espalha?', options: ['Toque', 'Testemunhar uma morte', 'Objetos amaldiçoados', 'Espelhos'], correctAnswer: 1 },
                { poster: 'Sorria 2.jpg', difficulty: 'facil', question: 'Tento ajudar pessoas mentalmente abaladas, Antes de viver cenas assustadas. Qual profissão de Rose?', options: ['Médica', 'Psiquiatra', 'Policial', 'Advogada'], correctAnswer: 1 },
                { poster: 'Sorria 2.jpg', difficulty: 'medio', question: 'Quanto mais dor emocional existir, Mais forte consigo agir. O que alimenta a entidade?', options: ['Raiva', 'Trauma e medo', 'Escuridão', 'Silêncio'], correctAnswer: 1 },
                { poster: 'Sorria 2.jpg', difficulty: 'medio', question: 'Mesmo vendo o terror acontecer, Ninguém consegue acreditar em você. O que isso causa?', options: ['Isolamento', 'Coragem', 'Confiança', 'Memórias felizes'], correctAnswer: 0 },
                { poster: 'Sorria 2.jpg', difficulty: 'medio', question: 'Existe um jeito cruel de sobreviver, Mas outro alguém precisa sofrer. Como escapar da entidade?', options: ['Rezando', 'Passando a maldição', 'Dormindo', 'Fugindo da cidade'], correctAnswer: 1 },
                { poster: 'Sorria 2.jpg', difficulty: 'dificil', question: 'O terror parece acabar no final, Mas tudo retorna de forma brutal. O que isso representa?', options: ['Fim definitivo', 'Ciclo da entidade', 'Nova vítima aleatória', 'Ritual incompleto'], correctAnswer: 1 },
                { poster: 'Sorria 2.jpg', difficulty: 'dificil', question: 'Quanto mais duvidam da sua visão, Mais você perde a noção. O que a protagonista enfrenta?', options: ['Possessão física', 'Colapso mental', 'Viagem astral', 'Hipnose'], correctAnswer: 1 },
                { poster: 'Sorria 2.jpg', difficulty: 'dificil', question: 'Não tenho forma fixa pra existir, Mas sempre preciso de alguém pra seguir. Quem sou eu?', options: ['Fantasma', 'Entidade amaldiçoada', 'Demônio vermelho', 'Alucinação'], correctAnswer: 1 }
                ],
            insidious: [
                { poster: 'Sobrenatural 1.jpg', difficulty: 'facil', question: 'Sou um lugar além da mente e da razão, Onde espíritos vagam na escuridão. Quem entra pode não voltar jamais, Pois o medo aqui nunca fica pra trás.', options: ['O Limbo', 'O Além', 'O Inferno', 'A Escuridão'], correctAnswer: 1 },
                { poster: 'Sobrenatural 1.jpg', difficulty: 'facil', question: 'Meu corpo dorme, mas minha mente se perdeu, Preso entre espíritos, desapareceu. Quem sou eu?', options: ['Josh', 'Dalton', 'Renai', 'Elise'], correctAnswer: 1 },
                { poster: 'Sobrenatural 1.jpg', difficulty: 'facil', question: 'Tenho rosto vermelho e sorriso cruel, Espero no escuro pelo momento fiel. Qual criatura sou eu?', options: ['Homem da sombra', 'Demônio vermelho', 'Fantasma negro', 'Espírito perdido'], correctAnswer: 1 },
                { poster: 'Sobrenatural 1.jpg', difficulty: 'medio', question: 'Sou capaz de enxergar além do normal, Guiando outros pelo sobrenatural. Mesmo com medo continuo a ajudar. Quem sou eu?', options: ['Lorraine', 'Elise', 'Regan', 'Mia'], correctAnswer: 1 },
                { poster: 'Sobrenatural 1.jpg', difficulty: 'medio', question: 'Não é sonho, mas parece ser, Pois a alma consegue do corpo correr. Como isso é chamado?', options: ['Premonição', 'Viagem astral', 'Possessão', 'Hipnose'], correctAnswer: 1 },
                { poster: 'Sobrenatural 1.jpg', difficulty: 'medio', question: 'Quando um corpo vazio aparece sem proteção, Algo maligno tenta ocupação. O que acontece?', options: ['Maldição eterna', 'Possessão espiritual', 'Ressurreição', 'Maldição mental'], correctAnswer: 1 },
                { poster: 'Sobrenatural 1.jpg', difficulty: 'dificil', question: 'Quanto mais assustado alguém ficar, Mais fácil as entidades podem atacar. O que fortalece os espíritos?', options: ['Ódio', 'Escuridão', 'Medo', 'Silêncio'], correctAnswer: 2 },
                { poster: 'Sobrenatural 1.jpg', difficulty: 'dificil', question: 'Sou uma abertura invisível e perigosa, Permitindo passagem monstruosa. Quanto mais aberta eu ficar, Mais difícil será escapar.', options: ['Portal espiritual', 'Maldição', 'Profecia', 'Ilusão'], correctAnswer: 0 },
                { poster: 'Sobrenatural 1.jpg', difficulty: 'dificil', question: 'Não quero matar logo de início, Prefiro esperar o momento propício. Meu objetivo é tomar o seu lugar. Quem sou eu?', options: ['Fantasma', 'Demônio possessor', 'Médium sombrio', 'Espírito perdido'], correctAnswer: 1 }
            ],
            conjuring: [
                { poster: 'Invocação 1.webp', difficulty: 'facil', question: 'Não sou brinquedo comum, mas pareço ser, Quem olha de fora não consegue entender. Fico parada, mas sei observar, E quando menos espera, começo a atuar.', options: ['Ed e Lorraine Warren', 'Sam e Dean', 'Mulder e Scully', 'Peter e Diane'], correctAnswer: 0 },
                { poster: 'Invocação 1.webp', difficulty: 'facil', question: 'Nome da boneca assustadora?', options: ['Chucky', 'Annabelle', 'Billy', 'Brahms'], correctAnswer: 1 },
                { poster: 'Invocação 1.webp', difficulty: 'facil', question: 'Qual família é assombrada?', options: ['Família Lutz', 'Família Perron', 'Família Hodgson', 'Família Lambert'], correctAnswer: 1 },
                { poster: 'Invocação 1.webp', difficulty: 'medio', question: 'O que Lorraine consegue fazer?', options: ['Ler mentes', 'Ver entidades', 'Mover objetos', 'Controlar tempo'], correctAnswer: 1 },
                { poster: 'Invocação 1.webp', difficulty: 'medio', question: 'Ritual para expulsar demônios?', options: ['Purificação', 'Exorcismo', 'Benção', 'Invocação'], correctAnswer: 1 },
                { poster: 'Invocação 1.webp', difficulty: 'medio', question: 'Ed é especialista em quê?', options: ['Psicologia', 'Demonologia', 'Teologia', 'Física'], correctAnswer: 1 },
                { poster: 'Invocação 1.webp', difficulty: 'dificil', question: 'Annabelle possui uma boneca?', options: ['Sim', 'Não', 'Às vezes', 'Nunca'], correctAnswer: 0 },
                { poster: 'Invocação 1.webp', difficulty: 'dificil', question: 'Warren têm museu de artefatos?', options: ['Sim', 'Não', 'Tinham', 'Nunca tiveram'], correctAnswer: 0 },
                { poster: 'Invocação 1.webp', difficulty: 'dificil', question: 'Casos dos Warren são reais?', options: ['Sim', 'Não', 'Baseados em fatos', 'Ficção'], correctAnswer: 2 }
            ],
            speak: [
                { poster: 'Fale 2.jpg', difficulty: 'facil', question: 'Não sou brinquedo nem chave comum, Mas abro portas para algo incomum. O que inicia tudo?', options: ['Livro antigo', 'Mão embalsamada', 'Espelho ritual', 'Símbolo demoníaco'], correctAnswer: 1 },

        function toggleFullscreen() {

                });
            } else {

        function resetGame() {
            const password = prompt('Digite a senha para resetar o jogo:');
            if (password === 'teste123') {
                localStorage.removeItem('horrorQuizPlayerName');
                localStorage.removeItem('horrorQuizRankings');
                state = {
                    screen: 'welcome',
                    playerName: '',
                    tempName: '',
                    currentMovie: '',
                    currentQuestionIndex: 0,
                    score: 0,
                    selectedAnswer: null,
                    showFeedback: false,

                render();

                alert('Senha incorreta!');

            backgroundMusic.play().catch(error => {
            console.log('Erro ao tocar música:', error);
        });
    }

    function playScareSound() {
        scareSound.currentTime = 0;
        scareSound.play().catch(error => {
            console.log('Erro ao tocar jumpscare:', error);
        });
    }

        function saveName() {
            if (state.tempName.trim()) {
                state.playerName = state.tempName.trim();
                localStorage.setItem('horrorQuizPlayerName', state.playerName);
                render();
            }
        }

        function changeName() {
            state.playerName = '';
            state.tempName = '';
            localStorage.removeItem('horrorQuizPlayerName');
            render();
        }

        function selectMovie(movieId) {
            state.currentMovie = movieId;
            state.currentQuestionIndex = 0;
            state.score = 0;
            state.selectedAnswer = null;
            state.showFeedback = false;
            state.screen = 'quiz';
            render();
        }

        function handleAnswer(answerIndex) {
            if (state.selectedAnswer !== null) return;

            state.selectedAnswer = answerIndex;
            const currentQuestion = questionsByMovie[state.currentMovie][state.currentQuestionIndex];
            const isCorrect = answerIndex === currentQuestion.correctAnswer;

            if (!isCorrect) {
                document.getElementById('jumpscare').classList.remove('hidden');
                playScareSound();
                setTimeout(() => {
                    document.getElementById('jumpscare').classList.add('hidden');
                }, 1000);
            } else {
                state.score++;
            }

            state.showFeedback = true;
            render();

            setTimeout(() => {
                const totalQuestions = questionsByMovie[state.currentMovie].length;
                if (state.currentQuestionIndex < totalQuestions - 1) {
                    state.currentQuestionIndex++;
                    state.selectedAnswer = null;
                    state.showFeedback = false;
                    render();
                } else {
                    const ranking = {
                        name: state.playerName || 'Anônimo',
                        movie: movieNames[state.currentMovie],
                        score: state.score,
                        total: totalQuestions
                    };
                    state.rankings.push(ranking);
                    state.rankings.sort((a, b) => b.score - a.score);
                    localStorage.setItem('horrorQuizRankings', JSON.stringify(state.rankings));
                    state.screen = 'results';
                    render();
                }
            }, 2500);
        }

            state.screen = 'welcome';
            state.currentMovie = '';
            state.currentQuestionIndex = 0;
            state.score = 0;
            state.selectedAnswer = null;
            state.showFeedback = false;
            render();
        }

        function render() {
            const app = document.getElementById('app');

            if (state.screen === 'welcome') {
                app.innerHTML = `
                    <div class="screen">
                        <div class="overlay"></div>
                        <div class="flicker"></div>
                        <div class="container">
                            <svg class="skull-icon" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
                                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
                                <circle cx="9" cy="10" r="1.5"/>
                                <circle cx="15" cy="10" r="1.5"/>
                                <path d="M9 16h6"/>
                            </svg>

                            <h1 class="title">ESCOLHA SEU PESADELO</h1>
                            <p class="subtitle">Selecione um filme de terror e teste seus conhecimentos</p>

                            ${!state.playerName ? `
                                <div class="form-box">
                                    <h3>Digite seu nome para começar</h3>
                                    <div class="input-group">
                                        <input type="text" id="nameInput" class="input" placeholder="Seu nome..." maxlength="20" value="${state.tempName}" onkeyup="if(event.key==='Enter') saveName()">
                                        <button class="btn btn-primary" onclick="saveName()">Continuar</button>
                                    </div>
                                </div>
                            ` : `
                                <div class="player-info">
                                    <span class="player-name">Bem-vindo, ${state.playerName}! 👻</span>
                                    <button class="btn btn-secondary" onclick="changeName()">Trocar Usuário</button>
                                </div>

                                <div class="movies-grid">
                                    <div class="movie-card" style="background-image: url('freddy.jpg')" onclick="selectMovie('nightmare')">
                                        <div class="movie-title">A Hora do Pesadelo</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('sorria.webp')" onclick="selectMovie('smile')">
                                        <div class="movie-title">Sorria</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('Sobrenatural.webp')" onclick="selectMovie('insidious')">
                                        <div class="movie-title">Sobrenatural</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('Invocação.webp')" onclick="selectMovie('conjuring')">
                                        <div class="movie-title">Invocação do Mal</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('fale.jpg')" onclick="selectMovie('speak')">
                                        <div class="movie-title">Fale comigo</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('jason.jpg')" onclick="selectMovie('friday13')">
                                        <div class="movie-title">Sexta-Feira 13</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('super.jpg')" onclick="selectMovie('supernatural')">
                                        <div class="movie-title">Supernatural</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('rua.jpeg')" onclick="selectMovie('Street')">
                                        <div class="movie-title">Rua do medo</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('panico.jpg')" onclick="selectMovie('panic')">
                                        <div class="movie-title">Pânico</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('jig.jpg')" onclick="selectMovie('saw')">
                                        <div class="movie-title">Jogos Mortais</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('coisa.jpeg')" onclick="selectMovie('it')">
                                        <div class="movie-title">It - A Coisa</div>
                                    </div>
                                    <div class="movie-card" style="background-image: url('carrie.jpg')" onclick="selectMovie('carrie')">
                                        <div class="movie-title">Carrie - A Estranha</div>
                                    </div>
                                </div>
                            `}

                            ${state.rankings.length > 0 ? `
                                <div class="ranking-box">
                                    <h3 class="ranking-title">
                                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
                                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                        </svg>
                                        RANKING GERAL
                                    </h3>
                                    <div class="ranking-list">
                                        ${state.rankings.slice(0, 10).map((rank, idx) => `
                                            <div class="ranking-item">
                                                <div class="ranking-position ${idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : 'normal'}">${idx + 1}</div>
                                                <div class="ranking-info">
                                                    <div class="ranking-name">${rank.name}</div>
                                                    <div class="ranking-movie">${rank.movie}</div>
                                                </div>
                                                <div class="ranking-score">${rank.score}/${rank.total}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;

                const nameInput = document.getElementById('nameInput');
                if (nameInput) {
                    nameInput.addEventListener('input', (e) => {
                        state.tempName = e.target.value;
                    });
                }
            } else if (state.screen === 'quiz') {
                const currentQuestion = questionsByMovie[state.currentMovie][state.currentQuestionIndex];
                const totalQuestions = questionsByMovie[state.currentMovie].length;

                app.innerHTML = `
                    <div class="screen" style="background: #000;">
                        <div class="score-display">
                            <div class="score-label">Pontuação</div>
                            <div class="score-value">${state.score}/${totalQuestions}</div>
                        </div>

                        <div class="quiz-screen">
                            <div class="quiz-poster" style="background-image: url('${currentQuestion.poster}')"></div>

                            <div class="quiz-content">
                                <div class="quiz-header">
                                    <div class="quiz-progress">Pergunta ${state.currentQuestionIndex + 1} de ${totalQuestions}</div>
                                    <div class="difficulty-badge diff-${currentQuestion.difficulty}">
                                        ${currentQuestion.difficulty === 'facil' ? 'Fácil' : currentQuestion.difficulty === 'medio' ? 'Médio' : 'Difícil'}
                                    </div>
                                </div>

                                <h2 class="quiz-question">${currentQuestion.question}</h2>
                                <div class="quiz-divider"></div>

                                <div class="options">
                                    ${currentQuestion.options.map((option, idx) => {
                                        const isSelected = state.selectedAnswer === idx;
                                        const isCorrect = idx === currentQuestion.correctAnswer;
                                        const showAsCorrect = state.selectedAnswer !== null && isCorrect;
                                        const showAsIncorrect = isSelected && !isCorrect && state.selectedAnswer !== null;

                                        return `
                                            <button class="option ${showAsCorrect ? 'correct' : ''} ${showAsIncorrect ? 'incorrect' : ''}"
                                                    onclick="handleAnswer(${idx})"
                                                    ${state.selectedAnswer !== null ? 'disabled' : ''}>
                                                <div class="option-letter">${String.fromCharCode(65 + idx)}</div>
                                                <span>${option}</span>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>

                                ${state.showFeedback ? `
                                    <div class="feedback ${state.selectedAnswer === currentQuestion.correctAnswer ? 'correct' : 'incorrect'}">
                                        ${state.selectedAnswer === currentQuestion.correctAnswer
                                            ? '✓ Resposta correta!'
                                            : `✗ Resposta incorreta! A resposta certa era: ${currentQuestion.options[currentQuestion.correctAnswer]}`}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'results') {
                const totalQuestions = questionsByMovie[state.currentMovie]?.length || 9;
                const percentage = Math.round((state.score / totalQuestions) * 100);
                const stars = Math.round((state.score / totalQuestions) * 5);
                const resultClass = percentage >= 70 ? 'success' : percentage >= 40 ? 'warning' : 'danger';
                const resultText = percentage >= 70 ? 'SOBREVIVEU!' : percentage >= 40 ? 'ESCAPOU!' : 'ELIMINADO!';
                const resultMsg = percentage >= 70 ? 'Você conhece bem seus filmes de terror!' : percentage >= 40 ? 'Você teve sorte desta vez...' : 'O terror venceu desta vez...';

                app.innerHTML = `
                    <div class="screen">
                        <div class="overlay"></div>
                        <div class="container">
                            <svg class="results-icon" style="filter: drop-shadow(0 0 20px ${percentage >= 70 ? '#22c55e' : percentage >= 40 ? '#fbbf24' : '#ef4444'})" viewBox="0 0 24 24" fill="none" stroke="${percentage >= 70 ? '#22c55e' : percentage >= 40 ? '#fbbf24' : '#ef4444'}" stroke-width="2">
                                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
                            </svg>

                            <h1 class="results-title ${resultClass}">${resultText}</h1>
                            <p class="results-msg">${resultMsg}</p>

                            <div class="results-box">
                                <div class="results-score">${state.score}/${totalQuestions}</div>
                                <div class="results-label">Respostas Corretas</div>

                                <div class="stars">
                                    ${[...Array(5)].map((_, idx) => `
                                        <svg class="star" viewBox="0 0 24 24" fill="${idx < stars ? '#fbbf24' : '#4b5563'}">
                                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                        </svg>
                                    `).join('')}
                                </div>

                                <div class="results-percent">${percentage}%</div>
                            </div>

                            <button class="btn btn-primary" onclick="restart()" style="padding: 20px 50px; font-size: 1.5rem;">
                                JOGAR NOVAMENTE
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        startBackgroundMusic();
        render();

        document.addEventListener('click', () => {
        startBackgroundMusic();
    }, { once: true });

    </script>
</body>
</html>
